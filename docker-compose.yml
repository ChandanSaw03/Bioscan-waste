version: '3.8'

services:
  bioscan-api:
    build: .
    container_name: bioscan-api
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./models:/app/models
      - ./data:/app/data
    environment:
      # S3 Bucket Configuration for AWS EC2 Deployment
      # Set this environment variable in your EC2 instance securely
      - BIOSCAN_S3_BUCKET=${BIOSCAN_S3_BUCKET:-}

  bioscan-ui:
    build: .
    container_name: bioscan-ui
    command: streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - BIOSCAN_API_URL=http://bioscan-api:8000
    depends_on:
      - bioscan-api
